<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-labelledby="title">
  <title id="title">Warren</title>
  <!-- 探头兔剪影（左下）+ 传送门圆环（右上）：专用于托盘模板与单色标，18px 下仍保持清晰分离 -->
  <g fill="#000000" fill-rule="evenodd">
    <!-- 左耳（微向左倾） -->
    <ellipse cx="64" cy="94" rx="22" ry="56" transform="rotate(-11 64 94)" />
    <!-- 右耳 -->
    <ellipse cx="122" cy="92" rx="22" ry="54" transform="rotate(6 122 92)" />
    <!-- 圆润兔头与下延肩部（左下与右下平滑对称收角，含双眼睛负空间镂空，朝右上注视） -->
    <path d="M 22 224 C 18 168 46 128 96 128 C 148 128 176 168 170 218 C 166 234 154 242 136 242 L 42 242 C 28 242 22 234 22 224 Z M 78 170 A 13 15 0 1 0 104 170 A 13 15 0 1 0 78 170 Z M 122 164 A 12 14 0 1 0 146 164 A 12 14 0 1 0 122 164 Z" />
    <!-- 右上角传送门圆环（加粗环形，18px 仍不糊） -->
    <path d="M 192 24 A 44 44 0 1 0 192 112 A 44 44 0 1 0 192 24 Z M 192 46 A 22 22 0 1 1 192 90 A 22 22 0 1 1 192 46 Z" />
  </g>
</svg>
