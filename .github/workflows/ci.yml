# 静态门与 macOS 构建分发：
# - static-gates：每次 push / PR 在 Ubuntu 上无头执行（lint / format:check / typecheck / 全部无头单测+UI 测试 / 渲染层构建）。
# - package-macos：push 到 main、推送 v* tag 或手动触发时在 macos-latest 构建并校验 `.dmg` / `.zip` 产物；
#   默认产出 ad-hoc 未签名安装包（配置 Apple 签名环境变量 Secrets 时自动启用签名与公证）。
# - release：仅推送 `refs/tags/v*` 时自动创建/更新 GitHub Release 并附带 `.dmg`、`.zip` 与 `SHA256SUMS.txt`。
#
# 全量真机 GUI 回归已从 CI 断舍离（日常 UI 与交互回归已在 static-gates 的无头 Vitest 中稳定覆盖）；
# 本机如需真机全量回归可按需执行 `bash scripts/regress/run-all.sh --allow-full`。
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm ci --omit=dev --ignore-scripts
        working-directory: plugins/whistle
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npx vite build --config vite.renderer.config.mjs

  package-macos:
    needs: static-gates
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    timeout-minutes: 25
    env:
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm ci --omit=dev --ignore-scripts
        working-directory: plugins/whistle

      - name: Build macOS packages (.dmg & .zip)
        run: npm run make

      - name: Collect & checksum installers
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist-macos
          mkdir -p dist-macos
          shopt -s nullglob
          dmgs=(out/make/dmg/*/*.dmg)
          zips=(out/make/zip/darwin/*/*.zip)
          if [ ${#dmgs[@]} -eq 0 ] || [ ${#zips[@]} -eq 0 ]; then
            echo "Expected both .dmg and .zip installers under out/make/"
            find out -maxdepth 4 2>/dev/null || true
            exit 1
          fi
          cp "${dmgs[@]}" "${zips[@]}" dist-macos/
          (cd dist-macos && shasum -a 256 *.dmg *.zip > SHA256SUMS.txt)
          ls -lh dist-macos
          cat dist-macos/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: warren-macos-arm64
          path: dist-macos
          if-no-files-found: error
          retention-days: 30

  release:
    needs: package-macos
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: warren-macos-arm64
          path: dist-macos
      - name: Publish GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist-macos/* --clobber
          else
            gh release create "$tag" dist-macos/* --verify-tag --generate-notes
          fi
