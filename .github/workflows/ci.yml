# 静态门：无头执行（lint / format / typecheck / 全部无头单测+UI 测试 / 渲染层构建）。
#
# **全量真机 GUI 回归**：已默认禁用自动触发，改为仅 `workflow_dispatch` 手动按需执行，
# 避免每次 push/PR 启动 Electron 窗口拖慢反馈；日常 UI 与交互回归已迁移至无头 Vitest（happy-dom）。
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  static-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npx vite build --config vite.renderer.config.mjs

  gui-regression:
    # 仅在手动触发 workflow_dispatch（重大改造/发版前）时执行，不在日常 push/PR 自动运行。
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 20
    env:
      WARREN_ALLOW_FULL_REGRESS: '1'
      WARREN_REGRESS_GUARD: '0'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci

      - name: 起 fixture（8899）
        run: |
          nohup node scripts/serve-fixture.mjs 8899 > /tmp/fixture.log 2>&1 &
          for i in $(seq 30); do
            [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8899/cap/form.html)" = "200" ] && exit 0
            sleep 1
          done
          echo "fixture 没起来"; cat /tmp/fixture.log; exit 1

      - name: 起 Warren（非 TTY）
        run: |
          nohup npm start < /dev/null > /tmp/warren.log 2>&1 &
          for i in $(seq 60); do
            [ -S "$HOME/.warren/runtime/envd.sock" ] && exit 0
            sleep 2
          done
          echo "应用没起来"; tail -40 /tmp/warren.log; exit 1

      - name: 全量回归
        run: bash scripts/regress/run-all.sh

      - name: 失败时留下日志
        if: failure()
        run: tail -80 /tmp/warren.log /tmp/fixture.log || true
