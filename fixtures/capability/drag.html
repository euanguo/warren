<!doctype html>
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <title>drag fixture</title>
    <style>
      #handle {
        width: 40px;
        height: 40px;
        background: #4a90d9;
        cursor: grab;
        user-select: none;
      }
      #track {
        width: 320px;
        height: 40px;
        background: #eee;
        position: relative;
      }
      #handle {
        position: absolute;
        left: 0;
        top: 0;
      }
    </style>
  </head>
  <body>
    <h1>拖拽</h1>
    <div id="track"><div id="handle"></div></div>
    <p id="pos">0</p>
    <script>
      const handle = document.getElementById('handle');
      const track = document.getElementById('track');
      let dragging = false;
      handle.addEventListener('mousedown', () => {
        dragging = true;
      });
      document.addEventListener('mouseup', () => {
        dragging = false;
      });
      document.addEventListener('mousemove', (event) => {
        if (!dragging) return;
        const rect = track.getBoundingClientRect();
        const x = Math.max(0, Math.min(rect.width - 40, event.clientX - rect.left - 20));
        handle.style.left = `${x}px`;
        document.getElementById('pos').textContent = String(Math.round(x));
      });
    </script>
  </body>
</html>
