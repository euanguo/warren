<!doctype html>
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <title>oopif fixture</title>
  </head>
  <body>
    <h1>跨源 iframe</h1>
    <p>本页从 127.0.0.1 加载，内层 iframe 从 localhost 加载（不同 site → OOPIF）。</p>
    <button id="outer">外层按钮</button>
    <iframe id="frame" src="http://localhost:8899/cap/frame.html" title="跨源内层页面" width="420" height="200"></iframe>
    <p id="outer-result">未点击</p>
    <script>
      document.getElementById('outer').onclick = () => {
        document.getElementById('outer-result').textContent = 'outer clicked';
      };
    </script>
  </body>
</html>
