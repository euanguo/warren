<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>全屏页面</title>
<style>
  #box { width: 240px; height: 120px; background: #2a5; color: #fff; }
  #box:fullscreen { width: 100%; height: 100%; background: #080; }
</style>
</head>
<body>
<h1 id="marker">全屏测试</h1>
<div id="box">这个盒子要全屏</div>
<button id="go">全屏</button>
<p id="state">fullscreenElement: null</p>
<script>
  const state = () => {
    document.getElementById('state').textContent =
      'fullscreenElement: ' + (document.fullscreenElement ? document.fullscreenElement.id : 'null');
  };
  document.getElementById('go').addEventListener('click', async () => {
    try {
      await document.getElementById('box').requestFullscreen();
    } catch (error) {
      document.getElementById('state').textContent = 'requestFullscreen 失败: ' + error.message;
    }
    state();
  });
  document.addEventListener('fullscreenchange', state);
</script>
</body>
</html>
